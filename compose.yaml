services:
  api:
    build: .
    container_name: trackbablo-api
    ports:
      - "8000:8000"
    environment:
       DATABASE_URL: "postgresql+psycopg://Elmir:${POSTGRES_PASSWORD}@postgres:5432/tracker"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: trackbablo-postgres
    environment:
      POSTGRES_USER: Elmir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tracker
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Elmir -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  trackbablo-data:
  postgres-data:


